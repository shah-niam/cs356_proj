# Defaults for the SWE-agent evaluation runner (run_infer.py). The model name is given
# on the command line (`--model`); everything else is read from here.
sweagent_dir: ../SWE-agent         # SWE-agent checkout, relative to this file (setup_sweagent.sh clones it there)
conda_env: sweagent1.1.0           # conda env with sweagent installed
config_name: [default, deepseek]   # SWE-agent config(s), applied in order; deepseek.yaml comes from sweagent_overrides/
num_workers: 1                     # run_all.sh overrides this to fit the machine
model:
  per_instance_cost_limit: 0.0     # 0 = unlimited
  per_instance_call_limit: 150
